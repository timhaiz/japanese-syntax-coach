name: JapaneseSyntaxCoach

options:
  bundleIdPrefix: com.juxintong
  deploymentTarget:
    iOS: '16.0'
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: RMBJCSP3G9

targets:
  JapaneseSyntaxCoach:
    type: application
    platform: iOS
    sources:
      - path: JapaneseSyntaxCoach
    resources:
      - path: JapaneseSyntaxCoach/Onboarding
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juxintong.nihongo
        INFOPLIST_FILE: JapaneseSyntaxCoach/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1'
        SWIFT_EMIT_LOC_STRINGS: YES
    entitlements:
      path: JapaneseSyntaxCoach/JapaneseSyntaxCoach.entitlements
    scheme:
      gatherCoverageData: false
